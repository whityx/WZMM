<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>WZMM</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/background.css">
    <link rel="stylesheet" href="css/toast.css">
    <link rel="stylesheet" href="css/modal.css">
    <link rel="stylesheet" href="css/dropdown.css">
    <link rel="stylesheet" href="css/splash.css">
    <link rel="stylesheet" href="css/tooltip.css">
    <link rel="stylesheet" id="theme-link" href="themes/purple.css">
</head>
<body>

    <div id="splash-screen" class="splash-overlay">
        <div class="splash-content">
            <div class="splash-logo-wrap">
                <div class="splash-glow"></div>
                <div class="splash-dynamic-logo"></div>
            </div>

            <div class="splash-status-wrap">
                <div id="splash-status" class="splash-status-text">Инициализация...</div>
                <div class="splash-progress-track">
                    <div id="splash-progress-bar" class="splash-progress-bar"></div>
                </div>
            </div>

            <button id="splash-skip-btn" class="splash-skip-btn" title="Пропустить">
                <span data-i18n-text="splash_skip_btn">Пропустить</span>
            </button>
        </div>
    </div>

    <aside class="sidebar">
        <div class="sidebar-active-indicator" id="sidebar-indicator"></div>

        <div class="sidebar-top">
            <div class="sidebar-header">
                <div class="sidebar-dynamic-logo"></div>
            </div>
            <div class="sidebar-divider"></div>
            
            <div class="sidebar-menu">
                <div class="sidebar-item active" data-page="installed" data-i18n-text="nav_installed">Installed</div>
                <div class="sidebar-item" data-page="download" data-i18n-text="nav_download">Get Mods</div>
            </div>
        </div>

        <div class="sidebar-bottom">
            <div class="sidebar-divider"></div>
            
            <div class="sidebar-menu">
                <div class="sidebar-item" data-page="downloads" data-i18n-text="nav_downloads">Downloads</div>
                <div class="sidebar-item" data-page="settings" data-i18n-text="nav_settings">Settings</div>
            </div>
            
            <button class="btn-launch" id="btn-launch-game" data-i18n-text="nav_launch_game">Launch Game</button>
        </div>
    </aside>

    <main class="main-content" id="content-container"></main>

    <button id="global-scroll-top-btn" class="scroll-top-btn" title="Наверх" aria-label="Наверх">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="18 15 12 9 6 15"></polyline>
        </svg>
    </button>

    <div id="gb-lightbox-modal" class="gb-lightbox-overlay" style="display: none;">
        <span class="gb-lightbox-close" id="gb-lightbox-close" title="Закрыть">&times;</span>
        <img id="gb-lightbox-img" class="gb-lightbox-img" src="" alt="">
        <div class="gb-lightbox-hint" data-i18n-text="gb_lightbox_hint">Нажмите в любое место или Escape для закрытия</div>
    </div>

    <script src="js/splash.js"></script>
    <script src="js/toastManager.js"></script>
    <script src="js/modalManager.js"></script>
    <script src="js/backgroundManager.js"></script>
    <script src="js/customdropdown.js"></script>
    <script src="js/tooltipManager.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
