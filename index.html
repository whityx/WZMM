<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>WZMM</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" id="theme-link" href="themes/base.css">
</head>
<body>

    <aside class="sidebar">
        <div class="sidebar-active-indicator" id="sidebar-indicator"></div>

        <div class="sidebar-top">
            <div class="sidebar-header">WZMM</div>
            <div class="sidebar-divider"></div>
            
            <div class="sidebar-menu">
                <div class="sidebar-item" data-page="installed" data-i18n-text="nav_installed">Installed</div>
                <div class="sidebar-item" data-page="download" data-i18n-text="nav_download">Get Mods</div>
            </div>
        </div>

        <div class="sidebar-bottom">
            <div class="sidebar-divider"></div>
            
            <div class="sidebar-menu">
                <div class="sidebar-item" data-page="downloads" data-i18n-text="nav_downloads">Downloads</div>
                <div class="sidebar-item" data-page="settings" data-i18n-text="nav_settings">Settings</div>
            </div>
            
            <button class="btn-launch" id="btn-launch-game" data-i18n-text="nav_launch_game">Launch Game</button>
        </div>
    </aside>

    <main class="main-content" id="content-container"></main>

    <script src="js/app.js"></script>
</body>
</html>
