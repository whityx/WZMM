<div class="page-header">
    <h2>Настройки приложения</h2>
</div>

<div class="input-group">
    <div class="input-label">Путь к ZZMI</div>
    <div class="input-row">
        <input type="text" id="setting-xxmi-path" class="text-input" placeholder="Например: /home/XXMI/ZZMI/">
        <button id="btn-select-xxmi" class="btn-secondary">Обзор</button>
    </div>
</div>

<div class="divider"></div>

<div class="input-group">
    <div class="input-label">Путь к bin </div>
    <div class="input-row">
        <input type="text" id="setting-xxmi-bin-path" class="text-input" placeholder="Например: /home/XXMI/Resources/Bin/">
        <button id="btn-select-xxmi-bin" class="btn-secondary">Обзор</button>
    </div>
</div>

<div class="divider"></div>

<div class="toggle-row">
    <div class="toggle-label">Язык | Language</div>
    <div class="select-wrapper">
        <select id="language-selector" class="mods-filter-select" style="background: transparent; border: 1px solid var(--border-subtle); outline: none; color: var(--text-primary); cursor: pointer; padding: 6px 12px; border-radius: var(--radius-sm); font-size: 0.85rem;">
            <option style="background:var(--bg-main);" value="show">Русский</option>
            <option style="background:var(--bg-main);" value="hide">English</option>
        </select>
    </div>
</div>
<div class="toggle-row">
    <div class="toggle-label">Фильтр контента (18+)</div>
    <div class="select-wrapper">
        <select id="setting-nsfw-mode" class="mods-filter-select" style="background: transparent; border: 1px solid var(--border-subtle); outline: none; color: var(--text-primary); cursor: pointer; padding: 6px 12px; border-radius: var(--radius-sm); font-size: 0.85rem;">
            <option style="background:var(--bg-main);" value="show">Показывать всё</option>
            <option style="background:var(--bg-main);" value="blur">Размытие (Blur)</option>
            <option style="background:var(--bg-main);" value="hide">Скрывать полностью</option>
        </select>
    </div>
</div>
