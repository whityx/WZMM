<div class="page-header">
    <h2 data-i18n-text="settings_title">Настройки приложения</h2>
</div>

<div class="input-group">
    <div class="input-label" data-i18n-text="settings_xxmi_path">Путь к ZZMI</div>
    <div class="input-row">
        <input type="text" id="setting-xxmi-path" class="text-input" placeholder="Например: /home/XXMI/ZZMI/">
        <button id="btn-select-xxmi" class="btn-secondary" data-i18n-text="settings_browse">Обзор</button>
    </div>
</div>

<div class="divider"></div>

<div class="input-group">
    <div class="input-label" data-i18n-text="settings_bin_path">Путь к bin</div>
    <div class="input-row">
        <input type="text" id="setting-xxmi-bin-path" class="text-input" placeholder="Например: /home/XXMI/Resources/Bin/">
        <button id="btn-select-xxmi-bin" class="btn-secondary" data-i18n-text="settings_browse">Обзор</button>
    </div>
</div>

<div class="divider"></div>

<div class="toggle-row">
    <div class="toggle-label" data-i18n-text="settings_theme">Тема оформления</div>
    <div class="select-wrapper">
        <select id="setting-theme" class="mods-filter-select">
        </select>
    </div>
</div>
<div class="toggle-row">
    <div class="toggle-label" data-i18n-text="settings_lang">Язык | Language</div>
    <div class="select-wrapper">
        <select id="language-selector" class="mods-filter-select">
            <option value="ru">Русский</option>
            <option value="en">English</option>
        </select>
    </div>
</div>
<div class="toggle-row">
    <div class="toggle-label" data-i18n-text="settings_nsfw">Фильтр контента (18+)</div>
    <div class="select-wrapper">
        <select id="setting-nsfw-mode" class="mods-filter-select">
            <option value="show" data-i18n-text="settings_nsfw_show">Показывать всё</option>
            <option value="blur" data-i18n-text="settings_nsfw_blur">Размывать везде</option>
            <option value="blur_local_only" data-i18n-text="settings_nsfw_blur_local_only">Размывать только локальные моды</option>
            <option value="blur_download_only" data-i18n-text="settings_nsfw_blur_download_only">Размывать только из вкладки скачать</option>
            <option value="hide" data-i18n-text="settings_nsfw_hide">Скрывать полностью</option>
        </select>
    </div>
</div>
<div class="toggle-row">
    <div class="toggle-label" data-i18n-text="settings_skip_splash">Пропускать экран загрузки при запуске</div>
    <label class="toggle-switch">
        <input type="checkbox" id="setting-skip-splash">
        <span class="toggle-slider"></span>
    </label>
</div>

<div class="divider"></div>

<div class="settings-footer">
    <div class="settings-author-info">
        <span class="settings-author-text"><span data-i18n-text="settings_author_label">Автор</span>: <strong class="settings-author-name">whityx</strong></span>
    </div>
    <a href="https://github.com/whityx/WZMM/" target="_blank" class="settings-github-link" id="settings-github-link" title="https://github.com/whityx/WZMM/">
        <svg class="settings-github-icon" viewBox="0 0 24 24" width="16" height="16" fill="currentColor">

        </svg>
        <span data-i18n-text="settings_project_link">Исходный код (GitHub)</span>
    </a>
</div>
