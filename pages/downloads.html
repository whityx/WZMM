<link rel="stylesheet" href="css/download.css">
<div class="installed-page-container">
    
    <div class="page-header">
        <div class="header-main-title">
            <h2>Менеджер загрузок</h2>
            <div class="downloads-summary">
                <div class="summary-badge active">
                    <span class="dot"></span>
                    <span>2 активных</span>
                </div>
                <div class="summary-badge speed">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>
                    <span>14.2 МБ/с</span>
                </div>
            </div>
        </div>

        <div class="header-controls">
            <div class="search-wrapper">
                <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                <input type="text" class="mods-search-input" placeholder="Поиск по загрузкам...">
            </div>

            <button class="btn-secondary" title="Поставить все на паузу">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" style="margin-right:6px;"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
                Пауза для всех
            </button>
            <button class="btn-refresh" title="Очистить список завершенных">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                Очистить
            </button>
        </div>
    </div>
    
    <div id="downloads-list" class="downloads-list">
        
        <div class="download-card state-downloading">
            <div class="download-preview" style="background-image: url('https://via.placeholder.com/120x80/1a1a24/fff');">
                <div class="download-status-tag active">Скачивание</div>
            </div>
            
            <div class="download-content">
                <div class="download-header-row">
                    <div class="download-title-block">
                        <span class="download-name">Cyberpunk Ultra HD Texture Pack</span>
                        <span class="download-subtext">Текстуры • 2.40 ГБ</span>
                    </div>

                    <div class="download-actions">
                        <button class="action-btn pause" title="Пауза">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
                        </button>
                        <button class="action-btn stop" title="Остановить и отменить">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
                        </button>
                    </div>
                </div>

                <div class="progress-section">
                    <div class="progress-bar-track">
                        <div class="progress-bar-fill downloading-glow" style="width: 68%;"></div>
                    </div>
                </div>

                <div class="download-footer-row">
                    <span class="meta-speed">8.5 МБ/с</span>
                    <span class="meta-info">1.63 GB / 2.40 GB</span>
                    <span class="meta-percent" style="color: var(--text-primary);">68%</span>
                    <span class="meta-eta">Осталось: ~1.5 мин</span>
                </div>
            </div>
        </div>

        <div class="download-card state-paused">
            <div class="download-preview" style="background-image: url('https://via.placeholder.com/120x80/1a1a24/fff');">
                <div class="download-status-tag paused">Пауза</div>
            </div>
            <div class="download-content">
                <div class="download-header-row">
                    <div class="download-title-block">
                        <span class="download-name">Realistic Lighting Overhaul v3.2</span>
                        <span class="download-subtext">Графика • 850 МБ</span>
                    </div>
                    <div class="download-actions">
                        <button class="action-btn resume" title="Возобновить">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                        </button>
                        <button class="action-btn stop" title="Остановить и отменить">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
                        </button>
                    </div>
                </div>
                <div class="progress-section">
                    <div class="progress-bar-track">
                        <div class="progress-bar-fill paused-glow" style="width: 42%;"></div>
                    </div>
                </div>
                <div class="download-footer-row">
                    <span class="meta-speed" style="color: var(--text-muted)">0 КБ/с</span>
                    <span class="meta-info">357 MB / 850 MB</span>
                    <span class="meta-percent" style="color: var(--text-primary);">42%</span>
                    <span class="meta-eta">Приостановлено</span>
                </div>
            </div>
        </div>

    </div>
</div>
