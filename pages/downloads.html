<link rel="stylesheet" href="css/download.css">
<div class="installed-page-container">
    
    <div class="page-header">
        <div class="header-main-title">
            <h2 data-i18n-text="dl_title">Менеджер загрузок</h2>
            <div class="downloads-summary">
                <div class="summary-badge active">
                    <span class="dot"></span>
                    <span>0 активных</span>
                </div>
                <div class="summary-badge speed">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>
                    <span>0 МБ/с</span>
                </div>
            </div>
        </div>

        <div class="header-controls">
            <div class="search-wrapper">
                <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                <input type="text" class="mods-search-input" data-i18n-placeholder="dl_search_ph" placeholder="Поиск по загрузкам...">
            </div>

            <button class="btn-refresh" data-i18n-title="dl_btn_pause_all" title="Поставить все на паузу">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
                <span data-i18n-text="dl_btn_pause_all">Пауза для всех</span>
            </button>
            <button class="btn-refresh" data-i18n-title="dl_btn_clear" title="Очистить список завершенных">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                <span data-i18n-text="dl_btn_clear">Очистить</span>
            </button>
        </div>
    </div>
    
    <div id="downloads-list" class="downloads-list">
    </div>
</div>
