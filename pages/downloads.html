<link rel="stylesheet" href="css/download.css">
<div class="installed-page-container downloads-page-wrap">
    
    <div class="page-header dl-page-header">
        <h2 data-i18n-text="dl_title">Менеджер загрузок</h2>

        <div class="header-controls dl-controls-bar">
            <div class="search-wrapper dl-search-wrapper">
                <input type="text" id="dl-search-input" class="mods-search-input" data-i18n-placeholder="dl_search_ph" placeholder="Поиск по загрузкам...">
                <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
            </div>

            <div class="dl-stats-group">
                <div class="dl-stat-badge dl-stat-speed" id="dl-stat-speed">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
                    </svg>
                    <span class="dl-stat-val" id="dl-speed-val">0 МБ/с</span>
                    <span class="dl-stat-lbl" data-i18n-text="dl_stat_speed">Скорость</span>
                </div>

                <div class="dl-stat-badge dl-stat-active" id="dl-stat-active">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="7 10 12 15 17 10"></polyline>
                        <line x1="12" y1="15" x2="12" y2="3"></line>
                    </svg>
                    <span class="dl-stat-val" id="dl-active-val">0</span>
                    <span class="dl-stat-lbl" data-i18n-text="dl_stat_active">В процессе</span>
                </div>
            </div>
        </div>
    </div>
    
    <div id="downloads-list" class="downloads-list"></div>
</div>
