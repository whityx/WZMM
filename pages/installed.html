<link rel="stylesheet" href="css/installed.css">

<div class="installed-page-container">
    <div class="page-header">
        <h2>Локальная библиотека</h2>
        
        <div class="header-controls">
            <div class="search-wrapper">
                <input type="text" id="mods-search" class="mods-search-input" placeholder="Найти мод...">
                <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
            </div>

            <div class="filter-container">
                <div class="select-wrapper">
                    <select id="mods-filter" class="mods-filter-select">
                        <option value="all">Все модификации</option>
                        <option value="active">Только включенные</option>
                        <option value="inactive">Только выключенные</option>
                    </select>
                    <span class="select-arrow">▼</span>
                </div>
            </div>
        </div>
    </div>
    
    <div id="mods-empty-state" style="display: none; margin-top: 30px; text-align: center; color: var(--text-muted); font-size: 1rem;">
        Библиотека пуста. Убедитесь, что пути в настройках указаны верно.
    </div>

    <div id="mods-grid" class="mods-grid"></div>

    <div id="mod-modal" class="modal-overlay">
        <div class="modal-content">
            <span class="modal-close" id="modal-close" title="Закрыть">&times;</span>
            
            <h3 id="modal-title" class="modal-title">Название мода</h3>
            <div id="modal-status" class="modal-status"></div>

            <a id="modal-source-link" class="modal-link" href="#" style="display: none; margin-bottom: 20px;">Открыть источник</a>
            
            <div class="modal-scroll-area">
                <div id="modal-image-container" class="modal-image-container"></div>
                <div id="modal-description" class="modal-text"></div>
            </div>
        </div>
    </div>
</div>
