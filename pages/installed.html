<link rel="stylesheet" href="css/installed.css">
<link rel="stylesheet" href="css/groupmenu.css">

<div class="installed-page-container">
    <div class="page-header">
        <h2 data-i18n-text="installed_title">Локальная библиотека</h2>
        
        <div class="header-controls">
            <div class="search-wrapper">
                <input type="text" id="mods-search" class="mods-search-input" data-i18n-placeholder="installed_search_ph" placeholder="Найти мод...">
                <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
            </div>

            <div class="filter-container">
                <div class="select-wrapper">
                    <select id="mods-filter" class="mods-filter-select">
                        <option value="all" data-i18n-text="installed_filter_all">Все модификации</option>
                        <option value="active" data-i18n-text="installed_filter_active">Только включенные</option>
                        <option value="inactive" data-i18n-text="installed_filter_inactive">Только выключенные</option>
                    </select>
                    <span class="select-arrow">▼</span>
                </div>
            </div>

            <button id="btn-group-manage" class="btn-group-manage">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
                    <line x1="12" y1="11" x2="12" y2="17"></line>
                    <line x1="9" y1="14" x2="15" y2="14"></line>
                </svg>
                <span data-i18n-text="installed_groups_btn">Управление группами</span>
            </button>
        </div>
    </div>
    
    <div id="mods-empty-state" style="display: none; margin-top: 30px; text-align: center; color: var(--text-muted); font-size: 1rem;" data-i18n-text="installed_empty">
        Библиотека пуста. Убедитесь, что пути в настройках указаны верно.
    </div>

    <div id="mods-grid" class="mods-grid"></div>

    <div id="group-side-drawer" class="group-side-drawer">
        <div class="group-drawer-header">
            <div class="group-drawer-title">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
                </svg>
                <span data-i18n-text="groups_title">Группы модов</span>
            </div>
            <button id="btn-close-group-drawer" class="group-drawer-close">&times;</button>
        </div>

        <div class="group-drawer-body">
            <div class="group-create-panel">
                <div id="group-panel-mode-title" class="group-panel-title" data-i18n-text="groups_create_title">Создать группу</div>
                <div class="group-input-wrapper">
                    <input type="text" id="group-name-input" class="group-text-input" placeholder="Название группы..." data-i18n-placeholder="groups_name_ph">
                </div>
                <div class="group-selection-info">
                    <span id="group-selected-count">Выбрано модов: 0</span>
                    <div class="group-quick-links">
                        <button id="btn-group-select-all" class="group-link-btn" data-i18n-text="groups_select_all">Выбрать все</button>
                        <button id="btn-group-deselect-all" class="group-link-btn" data-i18n-text="groups_deselect_all">Снять выбор</button>
                    </div>
                </div>
                <div class="group-btn-row">
                    <button id="btn-save-group" class="btn-group-primary" data-i18n-text="groups_create_btn">Создать группу</button>
                    <button id="btn-cancel-edit-group" class="btn-group-cancel" style="display: none;" data-i18n-text="groups_cancel_btn">Отмена</button>
                </div>
            </div>

            <div class="group-list-heading">
                <span data-i18n-text="groups_list_title">Существующие группы</span>
            </div>

            <div id="groups-container" class="groups-container"></div>
        </div>
    </div>

    <div id="group-toast" class="group-toast"></div>

    <div id="mod-modal" class="modal-overlay">
        <div class="modal-content">
            <span class="modal-close" id="modal-close" title="Закрыть">&times;</span>
            
            <h3 id="modal-title" class="modal-title">Название мода</h3>
            <div id="modal-status" class="modal-status"></div>

            <a id="modal-source-link" class="modal-link" href="#" style="display: none; margin-bottom: 20px;" data-i18n-text="modal_source">Открыть источник</a>
            
            <div class="modal-scroll-area">
                <div id="modal-image-container" class="modal-image-container"></div>
                <div id="modal-description" class="modal-text"></div>
            </div>
        </div>
    </div>
</div>
